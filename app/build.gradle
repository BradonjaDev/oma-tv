plugins {
    id 'com.android.application'
}

android {
    namespace 'de.omatv'
    compileSdk 35

    defaultConfig {
        applicationId 'de.omatv'
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName '1.6'
    }

    // Fester Schluessel, damit sich spaetere Versionen ueber die alte installieren lassen
    // (Einstellungen bleiben erhalten). Der Schluessel kommt aus den Umgebungsvariablen
    // OMA_KEYSTORE_FILE und OMA_KEYSTORE_PASSWORD (in GitHub Actions aus den Secrets).
    // Fehlen sie, etwa in einem Fork, wird mit dem Debug-Schluessel signiert.
    def keystoreFile = System.getenv('OMA_KEYSTORE_FILE')
    def keystorePassword = System.getenv('OMA_KEYSTORE_PASSWORD')
    def hasOmaKey = keystoreFile && keystorePassword && file(keystoreFile).exists()

    signingConfigs {
        if (hasOmaKey) {
            oma {
                storeFile file(keystoreFile)
                storePassword keystorePassword
                keyAlias 'omatv'
                keyPassword keystorePassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasOmaKey ? signingConfigs.oma : signingConfigs.debug
        }
        debug {
            if (hasOmaKey) signingConfig signingConfigs.oma
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.5.1'
}
