name: APK bauen

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Projekt finden (ZIP auspacken, falls noetig)
        run: |
          if [ -f settings.gradle ]; then
            SRC="."
          else
            ZIP="$(ls *.zip 2>/dev/null | head -n 1)"
            if [ -z "$ZIP" ]; then
              echo "::error::Keine ZIP-Datei gefunden. Bitte oma-tv-projekt.zip in das Repository hochladen."
              exit 1
            fi
            unzip -q "$ZIP" -d work
            SETTINGS="$(find work -maxdepth 3 -name settings.gradle | head -n 1)"
            if [ -z "$SETTINGS" ]; then
              echo "::error::In der ZIP-Datei steckt kein Oma-TV-Projekt."
              exit 1
            fi
            SRC="$(dirname "$SETTINGS")"
          fi
          echo "SRC=$SRC" >> "$GITHUB_ENV"

      - name: APK bauen
        run: |
          cd "$SRC"
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: APK einsammeln
        run: |
          APK="$(find "$SRC/app/build/outputs/apk/release" -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::Es wurde keine APK erzeugt."
            exit 1
          fi
          cp "$APK" oma-tv.apk
          ls -l oma-tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: oma-tv-apk
          path: oma-tv.apk

      - name: Zum Herunterladen bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view apk >/dev/null 2>&1; then
            gh release upload apk oma-tv.apk --clobber
          else
            gh release create apk oma-tv.apk --title "Oma TV" --notes "Automatisch gebaute App. Datei oma-tv.apk auf dem TV-Stick installieren."
          fi
